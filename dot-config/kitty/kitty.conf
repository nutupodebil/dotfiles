
shell /usr/bin/fish

font_family JetBrainsMono Nerd Font Mono

bold_font JetBrainsMono Nerd Font Mono Extra Bold
italic_font JetBrainsMono Nerd Font Mono Extra Bold Italic

font_size 14.0

#cursor_shape beam
cursor_trail 3

map ctrl+up increase_font_size
map ctrl+down decrease_font_size

hide_window_decorations no

map F11 toggle_fullscreen

window_padding_width 18

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
