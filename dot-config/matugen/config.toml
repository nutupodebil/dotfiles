[config]

#caching = true

# Defaults to the contrast from CLI if unspecified.
# Value from -1 to 1.
# -1 represents minimum contrast, 0 represents standard (i.e. the design as spec'd),
# and 1 represents maximum contrast.
contrast = 0


[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook   = "kitty +kitten themes --reload-in=all Matugen && cp ~/.config/kitty/current-theme.conf ~/.config/kitty/dark-theme.auto.conf"


#[templates.wallpaper]
#input_path  = '~/.config/matugen/templates/wallpaper'
#output_path = '~/.cache/matugen/wallpaper'


[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook   = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark'

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook   = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'


[templates.qt5ct]
input_path  = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path  = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'


[templates.kvantum_kvconfig]
input_path  = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path  = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'


[templates.telegram]
input_path  = '~/.config/matugen/templates/telegram.tdesktop-theme'
output_path = '~/.cache/matugen/colors.tdesktop-theme'
post_hook   = '~/.config/matugen/post-hook-scripts/telegram-theme.sh'


[templates.vesktop]
input_path  = '~/.config/matugen/templates/vesktop-midnight-colors.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'


[templates.cava]
input_path  = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen-theme'
post_hook   = 'pkill -USR1 cava'


[templates.spotify]
input_path  = '~/.config/matugen/templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook   = 'spicetify refresh'
#'spicetify apply -n' 
#'pgrep -x spicetify > /dev/null || spicetify apply -n'


[templates.btop]
input_path  = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook   = 'pkill -USR2 btop || true'


[templates.obs]
input_path  = '~/.config/matugen/templates/matugen.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'


#[templates.steam]
#input_path  = '~/.config/matugen/templates/steam.css'
#output_path = '~/.config/AdwSteamGtk/custom.css'
#post_hook   =  'adwaita-steam-gtk -i'


[templates.vscode-raw]
input_path  = '~/.config/matugen/templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path  = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'


[templates.zathura]
input_path  = '~/.config/matugen/templates/zathura-colors'
output_path = '~/.config/zathura/zathurarc'


[templates.zen-userchrome]
input_path  = '~/.config/matugen/templates/zen-userchrome.css'
output_path = '~/.zen/g6ysnhwn.Default (release)/chrome/zen-userChrome.css'


[templates.zen-usercontent]
input_path  = '~/.config/matugen/templates/zen-usercontent.css'
output_path = '~/.zen/g6ysnhwn.Default (release)/chrome/zen-userContent.css'


[templates.prismlauncher]
input_path  = '~/.config/matugen/templates/prismlauncher.json'
output_path = '~/.local/share/PrismLauncher/themes/Matugen/theme.json'


#[templates.nvim]
#input_path  = '~/.config/matugen/templates/nvim-colors.vim'
#output_path = '~/.config/nvim/colors/matugen.vim'
#post_hook   = 'pkill -SIGUSR1 nvim'

[templates.neovim]
input_path  = "~/.config/matugen/templates/nvim-colors.json"
output_path = "~/.config/matugen/themes/nvim-colors.json"
post_hook   = "pkill -SIGUSR1 nvim"
