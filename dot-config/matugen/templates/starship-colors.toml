
add_newline = true

format = '''
[╭─](color3 bold) $directory$git_branch $git_status
[╰─](color3 bold)$character
'''

right_format = """$time"""

palette = 'colors'

[palettes.colors]
mustard = '#af8700' # example
color1 = '{{colors.primary_fixed_dim.default.hex}}'
color2 = '{{colors.on_primary.default.hex}}'
color3 = '{{colors.on_surface_variant.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary.default.hex}}'
color6 = '{{colors.surface_dim.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.primary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'

# Prompt symbols 
[character]
success_symbol = "[❯](color9 bold)"
error_symbol = "[❯](@{error})"
vicmd_symbol = "[❯](#f9e2af)"

[directory]
truncate_to_repo = false
format = "[$path ](fg:color1)"

[git_branch]
format = "[($branch)](fg:color9)"

[git_status]
untracked = "?($count)"
modified = "!($count)"
staged = "+($count)"
format = "[$staged](fg:color3) [$modified](fg:color3) [$untracked](fg:color9)"

[time]
disabled = false
format = "[$time](fg:color3)"
time_format = "%H:%M:%S"

