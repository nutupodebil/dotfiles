
# sources
source = ~/.cache/iris/colors-hyprlock.conf
source = ~/.cache/matugen/hyprlock-image.conf

# general
general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
}

# background image
background {
    monitor =
    
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    # contrast = 1.05
    vibrancy = 0.1696
    vibrancy_darkness = 1.1
}

# clock
label {
    monitor =
    text = $TIME
    font_size = 100
    font_family = Adwaita Sans Black
    color = $fg
    position = 0, 130
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    font_size = 34
    font_family = Adwaita Sans Bold
    color = $accent
    position = 0, 40
    halign = center
    valign = center
}

# keyboard layout
label {
    monitor = eDP-1
    text = $LAYOUT [$ATTEMPTS] $FAIL
    font_size = 18
    font_family = Adwaita Sans Medium
    color = $fg

    position = 20, 20
    halign = left
    valign = bottom
}

# sleep button
label {
    monitor = eDP-1
    text = 󰒲
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    color = $fg

    position = -20, 20
    halign = right
    valign = bottom

    onclick = systemctl suspend
}


input-field {
    monitor = eDP-1
    size = 200, 50
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

    inner_color = $surface
    font_color = $fg

    font_family = JetBrainsMono Nerd Font #Fira Semibold

    outer_color = $surface

    outline_thickness = 3
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = Input Password... # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 10 # -1 means complete rounding (circle/oval)

    check_color = $accent
    fail_color = $red # if authentication failed, changes outer_color and fail message color

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 40

    shadow_color = $surface #entry_border_color

    shadow_boost = 1.6
}


